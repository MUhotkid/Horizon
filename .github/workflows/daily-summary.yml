name: Daily Horizon Summary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run Horizon
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: uv run horizon --config data/config.github.json --hours 24 --log-level INFO

      - name: Upload briefings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: horizon-briefings
          path: data/summaries/
          if-no-files-found: warn
          retention-days: 7
