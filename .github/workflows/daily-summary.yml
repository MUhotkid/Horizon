name: Daily Horizon Summary

on:
  schedule:
    # 每天北京时间 06:00，即 UTC 前一天 22:00
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run Horizon
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: uv run horizon --config data/config.github.json --hours 24 --log-level INFO

      - name: Send bilingual briefings to WeChat
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          token = os.environ.get("PUSHPLUS_TOKEN", "").strip()
          if not token:
              raise SystemExit("PUSHPLUS_TOKEN is missing")

          def chunks(text, limit=12000):
              parts = []
              while len(text) > limit:
                  cut = text.rfind("\n\n", 0, limit)
                  if cut < limit // 2:
                      cut = limit
                  else:
                      cut += 2
                  parts.append(text[:cut])
                  text = text[cut:]
              if text:
                  parts.append(text)
              return parts

          date = datetime.now(timezone.utc).strftime("%Y-%m-%d")
          messages = []

          for lang, label in [("zh", "中文"), ("en", "English")]:
              path = Path(f"data/summaries/horizon-{date}-{lang}.md")
              if not path.exists():
                  raise SystemExit(f"Briefing not found: {path}")
              text = path.read_text(encoding="utf-8")
              if not text.strip():
                  raise SystemExit(f"Briefing is empty: {path}")
              parts = chunks(text)
              for number, part in enumerate(parts, 1):
                  title = f"Horizon {date} {label} {number}/{len(parts)}"
                  messages.append((title, part))

          for index, (title, content) in enumerate(messages):
              if index:
                  time.sleep(15)

              payload = json.dumps({
                  "token": token,
                  "title": title,
                  "content": content,
                  "template": "markdown",
                  "channel": "wechat"
              }, ensure_ascii=False).encode("utf-8")

              request = urllib.request.Request(
                  "https://www.pushplus.plus/send",
                  data=payload,
                  headers={"Content-Type": "application/json"},
                  method="POST"
              )

              with urllib.request.urlopen(request, timeout=60) as response:
                  result = json.load(response)

              if str(result.get("code")) != "200":
                  raise SystemExit(
                      f"PushPlus rejected message: code={result.get('code')}"
                  )

              print(f"PushPlus accepted: {title}")
          PY

      - name: Upload briefings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: horizon-briefings
          path: data/summaries/
          if-no-files-found: warn
          retention-days: 7
